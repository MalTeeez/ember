name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ember.slnx

      - name: Build
        run: dotnet build Ember.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Ember.Tests/Ember.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish win-x64
        run: dotnet publish src/Ember/Ember.csproj -c Release -r win-x64 -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Ember-win-x64
          path: |
            publish/Ember.exe
            install.ps1
            uninstall.ps1
          if-no-files-found: warn
