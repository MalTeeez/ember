name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Runs of one branch or tag one after the other, so two pushes cannot both create the same release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ember.slnx

      - name: Build
        run: dotnet build Ember.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Ember.Tests/Ember.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish win-x64
        shell: pwsh
        run: |
          # A tag v1.2.3 sets the version of the exe.
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '' }
          if ($version) { dotnet publish src/Ember/Ember.csproj -c Release -r win-x64 -o publish -p:Version=$version }
          else { dotnet publish src/Ember/Ember.csproj -c Release -r win-x64 -o publish }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Ember-win-x64
          path: publish/Ember.exe
          if-no-files-found: warn

      - name: Release
        # A pushed tag v*, or a push to main with a new <Version> in Ember.csproj (tag v<major>.<minor>[.<patch>]),
        # creates the tag (if needed) and a GitHub release with the exe. Each tag gets one release.
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == 'main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') { $tag = '${{ github.ref_name }}' }
          else {
            [xml]$proj = Get-Content src/Ember/Ember.csproj
            $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
            $parts = $v.Split('.')
            $tag = 'v' + ($(if ($parts.Count -ge 3 -and $parts[2] -ne '0') { $v } else { "$($parts[0]).$($parts[1])" }))
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag exists: nothing to do."; exit 0 }
          Copy-Item publish/Ember.exe "Ember-$tag-win-x64.exe"
          $notes = "docs/releases/$tag.md"
          $ghArgs = @($tag, "Ember-$tag-win-x64.exe", '--title', "Ember $tag", '--target', '${{ github.sha }}')
          if (Test-Path $notes) { $ghArgs += @("--notes-file", $notes) } else { $ghArgs += "--generate-notes" }
          gh release create @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
